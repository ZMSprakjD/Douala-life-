<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Douala Life Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>Douala Life</h1>
        <div class="stats">
            <p>Day: <span id="day">1</span></p>
            <p>Money: <span id="money">5000</span> FCFA</p>
            <p>Health: <span id="health">100</span>%</p>
            <p>Happiness: <span id="happiness">50</span>%</p>
        </div>
        <div class="actions">
            <button onclick="work()">Go to Work</button>
            <button onclick="rest()">Rest</button>
            <button onclick="explore()">Explore Akwa</button>
        </div>
        <p id="message">Welcome to Douala! What will you do today?</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
